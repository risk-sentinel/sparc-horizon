name: Secret scan (TruffleHog)

# Modelled on risk-sentinel/container-build-sign's and sparc-validate's
# secret-scan.yml so the estate runs one scanner with one configuration.
#
# Two jobs, and the second is the point:
#   - scan               hard gate, verified secrets only, fixture excluded
#   - fixture-detection  soft-run/hard-assert. Scans ONLY the fixture and asserts a
#                        detection fires. Without it, a regressed scanner and a
#                        clean repo look identical — the gate would silently stop
#                        working and still report green.
#
# This is the GATE. Converting results to evidence is a separate concern and lives
# in secret-scan-hdf-emit.yml: the gate blocks, the emitter records.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Verified secrets gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff + schedule modes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog — verified-only, fail on finding
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          # The action adds --fail itself; do not duplicate it.
          #
          # --only-verified cuts noise but means an unverifiable-but-real
          # credential passes this gate. That mode choice is deliberate and is
          # stated here so it is not mistaken for full coverage.
          extra_args: --only-verified --exclude-paths=.trufflehog-exclude-paths

  fixture-detection:
    name: Fixture detection (proves scanner works)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: TruffleHog — scan fixture only, expect detection
        id: tf
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: tests/trufflehog-fixture
          # No --only-verified and no exclude file: the plant is a synthetic key
          # that cannot verify, so requiring verification here would make this
          # job pass for the wrong reason.
        continue-on-error: true

      - name: Assert fixture key was detected
        env:
          OUTCOME: ${{ steps.tf.outcome }}
        run: |
          echo "TruffleHog step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Fixture-detection did not flag the synthetic AWS key. Either the scanner regressed, the fixture was damaged, or the AWS detector no longer fires on AKIA-prefixed strings. The verified-secrets gate above cannot be trusted until this is resolved."
            exit 1
          fi
          echo "PASS — synthetic key in tests/trufflehog-fixture/ was detected as expected."
