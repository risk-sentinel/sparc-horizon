name: SonarQube HDF emit

# Self-contained. This workflow calls NO other repository.
#
# It is a full copy rather than a caller, and that is deliberate: GitHub does not
# let a PUBLIC repository use a workflow from a PRIVATE or INTERNAL one, and the
# failure presents as a 0-second, 0-job run with no logs and nothing to read. It
# also makes the pattern unadoptable outside this org. So the logic lives here, in
# full, in every repo that needs it. Copy this file, change the CONFIGURATION
# block, done.
#
# What it does: SonarCloud's GitHub App runs the analysis; this FETCHES the
# results afterwards, converts them to OASIS Heimdall Data Format, stamps scan
# provenance onto them, validates against the HDF schema, and (optionally) puts
# them in the evidence bucket so they join the same stream as InSpec, SCA and
# secret-scanning results.
#
# ---- The failure this file is mostly about ----------------------------------
#
# An UNKNOWN Sonar project returns an empty result, and an empty result converts
# into a valid, schema-clean HDF. A broken lookup and a genuinely clean project
# therefore produce the same evidence unless the project is verified to exist
# first. Hence "Resolve and verify" below, which fails rather than fetching.
#
# Project keys are assigned at onboarding and do NOT follow a GitHub repo rename:
# SonarCloud freezes the key. A repo renamed after onboarding keeps its old key,
# and the lookup then points at nothing while reporting success.
#
# ---- Horizon's departures from the sibling copies ---------------------------
#
#   * Boundary is `risk-sentinel` with NO `|| 'sparc'` fallback. Horizon projects
#     posture ACROSS authorization boundaries rather than sitting inside one, and
#     it is the first producer in the estate to use that value (sparc-horizon#1;
#     estate pivot in sparc-iac#715). The preflight fails closed on an unset
#     variable: a fallback turns a misconfiguration into a valid write to the
#     wrong boundary, where the evidence exists, validates, and nobody reads for it.
#   * Bucket comes from the COMPLIANCE_S3_BUCKET secret rather than a literal.
#     sparc-iac#537 names that secret as the org standard, and a bucket name in a
#     tracked file is a resource identifier in content read more widely than code.
#
# Never runs on pull_request: a fork PR has no OIDC credentials, and the evidence
# stream should reflect only what landed on the default branch.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1'    # weekly, so evidence does not go stale between merges
  workflow_dispatch:
    inputs:
      use_saf:
        description: 'Override: use the SAF CLI bridge instead of hdf-cli for this run.'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write           # AWS OIDC for the S3 emit; harmless when not emitting

env:
  # ---- CONFIGURATION -------------------------------------------------------
  SONAR_ORGANIZATION: 'risk-sentinel'
  SONAR_HOST_URL: 'https://sonarcloud.io'
  REPO_SLUG: 'sparc-horizon'
  # ---- Pinned producers — bump deliberately --------------------------------
  HDF_CLI_VERSION: v3.5.1
  SAF_VERSION: '1.6.0'

jobs:
  preflight:
    name: Boundary is set
    runs-on: ubuntu-latest
    outputs:
      boundary: ${{ steps.b.outputs.boundary }}
    steps:
      - name: Require EVIDENCE_BOUNDARY
        id: b
        env:
          BOUNDARY: ${{ vars.EVIDENCE_BOUNDARY }}
        run: |
          set -euo pipefail
          if [ -z "${BOUNDARY:-}" ]; then
            echo "::error::EVIDENCE_BOUNDARY is not set. Set it as a repository variable to 'risk-sentinel' (sparc-horizon#1). Refusing to emit rather than defaulting — a default files this repository's evidence under somebody else's boundary while reporting success."
            exit 1
          fi
          echo "boundary=${BOUNDARY}" >> "$GITHUB_OUTPUT"
          echo "Emitting under boundary: ${BOUNDARY}"

  emit:
    name: SonarQube -> HDF
    needs: preflight
    runs-on: ubuntu-latest
    env:
      # Self-identifying artifact name, so a downloaded artifact traces back to
      # the repo it came from. The S3 object drops it: the repo is in the path.
      HDF_FILE: 'sparc-horizon-sonarqube-hdf.json'
      BOUNDARY: ${{ needs.preflight.outputs.boundary }}
      BUCKET: ${{ secrets.COMPLIANCE_S3_BUCKET }}
      # Presence of the emit role, as a boolean. Job-level because `secrets` is
      # not an available context in a step `if:` — and neither is a step's OWN
      # `env:`. A boolean rather than the ARN, so it is not exported into every
      # step's environment.
      HAS_EMIT_ROLE: ${{ secrets.SPARC_HORIZON_EMIT_ARN != '' }}
    steps:
      # Derived from GITHUB_REPOSITORY rather than github.event.repository.name,
      # which is not populated on `schedule` runs.
      - name: Resolve and verify the SonarQube project key
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is not set. Without it there is nothing to fetch, and an empty result converts into a clean-looking report."
            exit 1
          fi
          KEY="${GITHUB_REPOSITORY/\//_}"
          code=$(curl -sS -o /tmp/sonar-project.json -w '%{http_code}' \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/components/show?component=${KEY}")
          if [ "$code" = "404" ]; then
            echo "::error::No SonarCloud project with key '${KEY}'."
            echo "::error::SonarCloud does not rename a project key when the GitHub repo is renamed, so a repo renamed after onboarding keeps its OLD key. Rename the project key in SonarCloud (Project Settings -> Update Key) to '${KEY}', or this job will fetch nothing and emit an empty, clean-looking report."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Could not verify the SonarCloud project (HTTP ${code}). Refusing to fetch: an unverified key can return an empty result that looks clean."
            cat /tmp/sonar-project.json || true
            exit 1
          fi
          echo "SONAR_PROJECT_KEY=${KEY}" >> "$GITHUB_ENV"
          echo "Verified SonarCloud project: ${KEY}"

      - name: Select producer
        id: prod
        env:
          USE_SAF: ${{ inputs.use_saf || vars.SONARQUBE_HDF_USE_SAF == 'true' }}
        run: |
          set -euo pipefail
          if [ "$USE_SAF" = "true" ]; then
            echo "tool=saf" >> "$GITHUB_OUTPUT"
            echo "Producer: SAF CLI bridge (saf convert sonarqube2hdf)."
          else
            echo "tool=hdf-cli" >> "$GITHUB_OUTPUT"
            echo "Producer: Go hdf-cli (hdf fetch sonarqube)."
          fi

      # Always installed: the producer on the hdf-cli path, AND the schema
      # validator for BOTH producers' output.
      - name: Install hdf-cli (pinned, checksum-verified)
        env:
          VER: ${{ env.HDF_CLI_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/mitre/hdf-libs/releases/download/${VER}"
          tar="hdf_${VER#v}_linux_amd64.tar.gz"
          # --proto pins the initial request to https; --proto-redir pins every
          # REDIRECT too. -L without the second one will happily follow a 302
          # into plain http, and release downloads redirect to a CDN, so the
          # redirect is the part that matters.
          curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 "$base/${tar}" -o "${tar}"
          curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 "$base/checksums.txt" -o checksums.txt
          grep " ${tar}$" checksums.txt | sha256sum -c -
          tar -xzf "${tar}" hdf
          install -m 0755 hdf /usr/local/bin/hdf
          hdf version

      - name: Convert SonarQube results -> OHDF
        env:
          SONARQUBE_TOKEN: ${{ secrets.SONAR_TOKEN }}   # hdf-cli reads this name
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}       # saf reads --auth
          TOOL: ${{ steps.prod.outputs.tool }}
        run: |
          set -euo pipefail
          # Token presence and project existence were both checked above.
          if [ "$TOOL" = "hdf-cli" ]; then
            args=(fetch sonarqube "$HDF_FILE" --url "$SONAR_HOST_URL" --project-key "$SONAR_PROJECT_KEY" --format hdf)
            [ -n "${SONAR_ORGANIZATION:-}" ] && args+=(--organization "$SONAR_ORGANIZATION")
            hdf "${args[@]}"
          else
            # Installed with --ignore-scripts rather than run through `npx`.
            # npx resolves and executes a package on demand, running its install
            # lifecycle scripts — arbitrary code from the registry, before the
            # tool does anything. This pins the version, refuses lifecycle
            # scripts, and then calls the binary directly.
            npm install --global --no-fund --no-audit --ignore-scripts "@mitre/saf@${SAF_VERSION}"
            # saf's sonarqube2hdf takes no --organization; the token scopes the org.
            saf convert sonarqube2hdf \
              -n "$SONAR_PROJECT_KEY" -u "$SONAR_HOST_URL" --auth "$SONAR_TOKEN" -o "$HDF_FILE"
          fi

      # Stamp scan provenance so each finding traces to the exact repo + commit,
      # and cross-repo aggregation groups on the same keys. LOCKED vocabulary --
      # keep these key names identical across repos and scanners.
      - name: Label HDF target (scan provenance)
        env:
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          hdf label set "$HDF_FILE" \
            repo="$REPO" \
            commit="$COMMIT" \
            ref="$REF" \
            scanner=sonarqube \
            run_id="$RUN_ID" \
            sonar_project_key="$SONAR_PROJECT_KEY" \
            -o "$HDF_FILE.labeled"
          mv "$HDF_FILE.labeled" "$HDF_FILE"
          hdf label show "$HDF_FILE"

      - name: Validate OHDF output
        run: |
          set -euo pipefail
          test -s "$HDF_FILE"
          # A clean project (zero open issues) is valid evidence, and schema
          # validation correctly accepts it. That is the point: "we looked and
          # found nothing" must be recordable, or a clean repo and a broken
          # pipeline leave identical traces.
          hdf validate "$HDF_FILE" -q
          echo "OHDF schema-valid."

      - name: Upload HDF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonarqube-hdf-sparc-horizon
          path: ${{ env.HDF_FILE }}
          if-no-files-found: error

      # ---- S3 emit, gated on the role being present and assumable ------------
      # continue-on-error so an adopter with no AWS still gets a green convert +
      # validate. The trade-off is real and is called out in the notice below: a
      # MISNAMED role skips silently too. If you wire an emit role, check the
      # first run actually says "Emitted to s3://".
      #
      # Horizon's role does not exist yet (sparc-iac#715), so the expected first
      # result on main is a green job carrying the skip notice.
      - name: Configure AWS credentials (OIDC)
        id: aws
        if: env.HAS_EMIT_ROLE == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.SPARC_HORIZON_EMIT_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Emit OHDF to the evidence bucket
        if: steps.aws.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -z "${BUCKET:-}" ]; then
            echo "::error::COMPLIANCE_S3_BUCKET is not set, but the emit role assumed successfully. Refusing to guess a bucket name."
            exit 1
          fi
          DATE="$(date -u +%Y-%m-%d)"
          # Canonical layout: <boundary>/<date|latest>/<repo>/sonarqube/sonarqube-hdf.json
          for slot in "${DATE}" latest; do
            aws s3 cp "$HDF_FILE" \
              "s3://${BUCKET}/${BOUNDARY}/${slot}/${REPO_SLUG}/sonarqube/sonarqube-hdf.json" \
              --no-progress
          done
          echo "Emitted to s3://${BUCKET}/${BOUNDARY}/{${DATE},latest}/${REPO_SLUG}/sonarqube/sonarqube-hdf.json"

      - name: Note when the S3 emit was skipped
        if: env.HAS_EMIT_ROLE != 'true' || steps.aws.outcome != 'success'
        run: |
          echo "::notice::OHDF converted, labelled and validated; S3 emit skipped (aws=${{ steps.aws.outcome }}). Either no emit role is wired — expected until sparc-iac#715 provisions SPARC_HORIZON_EMIT_ARN, and the artifact is the deliverable meanwhile — or the configured role could not be assumed. If you expect this repo to emit, that is a bug: check the secret name matches a role that exists."
