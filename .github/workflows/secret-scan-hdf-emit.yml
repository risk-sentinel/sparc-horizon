name: Secret scan HDF emit (TruffleHog)

# Caller for the reusable secret-scan-hdf.yml in risk-sentinel/dev-sec-ops-baseline.
#
# ---- Why a clean scan still emits -------------------------------------------
#
# `hdf convert` errors on empty input, so the obvious implementation skips the
# upload when nothing is found. A clean scan is the normal case, which means a
# clean repository and a broken pipeline then leave byte-for-byte identical state
# in the bucket: nothing. Thirteen repositories sat that way until
# dev-sec-ops-baseline#21.
#
# A clean run emits a one-control HDF recording the EXECUTION — scanner, version,
# commit, mode, zero findings. It records that a scan ran; it does not synthesise
# a finding.
#
# ---- Boundary: risk-sentinel, and no fallback -------------------------------
#
# Horizon projects posture ACROSS authorization boundaries and is not a component
# of the SPARC boundary, so its evidence files under `risk-sentinel`, not `sparc`.
# Horizon is the first producer in the estate to use that value; the rest pivot
# under sparc-iac#715. See sparc-horizon#1.
#
# The estate carries 24 hardcoded `|| 'sparc'` fallbacks and is removing them. This
# repository adds none: the preflight below FAILS when EVIDENCE_BOUNDARY is unset.
# A fallback turns a misconfiguration into a valid write to the wrong boundary,
# which is worse than an error — the evidence exists, validates, and nobody is
# reading for it there. The reusable's own `boundary` input is required and
# deliberately undefaulted for the same reason, but an empty string satisfies
# `required: true`, so the check has to happen here.
#
# Never runs on pull_request: a fork PR has no OIDC credentials, and the evidence
# stream should only reflect what landed on the default branch.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Boundary is set
    runs-on: ubuntu-latest
    outputs:
      boundary: ${{ steps.b.outputs.boundary }}
    steps:
      - name: Require EVIDENCE_BOUNDARY
        id: b
        env:
          BOUNDARY: ${{ vars.EVIDENCE_BOUNDARY }}
        run: |
          set -euo pipefail
          if [ -z "${BOUNDARY:-}" ]; then
            echo "::error::EVIDENCE_BOUNDARY is not set. Set it as a repository variable to 'risk-sentinel' (sparc-horizon#1). Refusing to emit rather than defaulting — a default files this repository's evidence under somebody else's boundary while reporting success."
            exit 1
          fi
          echo "boundary=${BOUNDARY}" >> "$GITHUB_OUTPUT"
          echo "Emitting under boundary: ${BOUNDARY}"

  emit:
    needs: preflight
    # v0.10.1 is the first tag whose upload sends `--sse aws:kms` on the request.
    # The bucket already applies SSE-KMS by default, so objects land encrypted on
    # either pin — but default encryption does NOT populate the
    # `s3:x-amz-server-side-encryption` condition key, and the bucket policy reads
    # the REQUEST HEADER. Under v0.9.1 this repository's writes are refused the
    # moment sparc-iac#721 re-establishes that deny. "The object is encrypted" and
    # "the deny is satisfied" are different statements.
    uses: risk-sentinel/dev-sec-ops-baseline/.github/workflows/secret-scan-hdf.yml@c399c2610e73ac6d148a77cbf2a5ce0e79b2f8e2  # v0.10.1
    with:
      boundary: ${{ needs.preflight.outputs.boundary }}
    secrets:
      # Per-repo descriptive emit secret, per sparc-iac#537 — a generic name hides
      # which repo an ARN belongs to. Scoped to risk-sentinel/*/sparc-horizon/*,
      # deliberately WITHOUT the sparc/* prefix the in-boundary producers hold,
      # because this repository sits above the SPARC authorization boundary.
      # Provisioned under sparc-iac#715 and proven end to end on 2026-09-19: the
      # object was read back from the bucket, not inferred from a green job.
      S3_EMIT_ROLE_ARN: ${{ secrets.SPARC_HORIZON_EMIT_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      COMPLIANCE_S3_BUCKET: ${{ secrets.COMPLIANCE_S3_BUCKET }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
