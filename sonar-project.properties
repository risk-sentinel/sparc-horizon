# SonarCloud analysis configuration.
#
# Two things in this repository look exactly like defects to a tool that has
# not been told otherwise, and both are deliberate. Reporting them is worse
# than noise: a reasonable person resolves the finding, the plant disappears,
# and a guard stops guarding while every check stays green.

sonar.projectKey=risk-sentinel_sparc-horizon
sonar.organization=risk-sentinel

# The design docs are dense with non-ASCII, and the UUIDv5 key grammar in
# docs/03-data-model.md is specified in terms of a control character.
sonar.sourceEncoding=UTF-8

# ---- Not analysed at all ----------------------------------------------------
#
# tests/ holds two defects planted ON PURPOSE, each asserted by a CI job:
#
#   tests/trufflehog-fixture/aws-credentials.txt   the AWS documentation
#       example key pair, which authenticates to nothing. It exists so the
#       secret-scanning gate can prove it still detects AWS keys.
#   tests/actionlint-fixture/shellcheck-canary.yml an SC2012 defect. It exists
#       because actionlint EXITS 0 when shellcheck is absent — it skips the
#       integration rather than reporting it — so without the canary a
#       silently-skipped shellcheck is undetectable.
#
# Both are the reason the secret scan and workflow lint can be believed.
# Excluding them here weakens nothing: TruffleHog still scans the fixture, and
# the canary is still asserted by its own job.
sonar.exclusions=tests/**

# ---- Analysed, but exempt from copy-paste detection -------------------------
#
# demo/full-plan.html contains VERBATIM copies of the scripts in demo/hud.html
# and demo/planner.html. That duplication is maintained on purpose and the
# "Duplicated copies agree" job FAILS THE BUILD when the copies drift — see
# docs/dev/Developer_Collision_Avoidance_Plan.md 2.1 and 2.3.
#
# Copy-paste detection would therefore report a duplication that the pipeline
# mandates, permanently, with no resolution available that does not break a
# required check. The demos are still analysed for real defects; only the
# duplication axis is exempt.
sonar.cpd.exclusions=demo/**

# ---- Test sources -----------------------------------------------------------
#
# Go colocates tests with the code they test, so without this the test file is
# analysed as production source. internal/canonical is 92 lines of source and
# 103 of tests: more than half the package would be measured as the wrong kind
# of code.
sonar.test.inclusions=**/*_test.go

# ---- Deliberately absent: coverage ------------------------------------------
#
# sonar.go.coverage.reportPaths=coverage.out is the correct setting and is NOT
# set here, because it cannot work under the analysis this project uses today.
# SonarCloud Automatic Analysis does not run in the pipeline, so it can never
# read an artifact that ci.yml produces. Setting it would imply coverage is
# reported when it is not.
#
# Coverage requires moving to CI-based analysis, which is mutually exclusive
# with automatic analysis — enabling both makes the project report twice and
# disagree with itself. That decision is S1-4, tracked on #42.
