# Ported because this repository is public and container-build-sign is internal: a
# public repository cannot call its reusable workflows or composite actions
# (sparc-horizon#84, container-build-sign#342). Every local edit is marked
# `PORT(sparc-horizon)`; everything else is byte-identical to upstream, so a diff
