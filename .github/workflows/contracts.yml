name: Contracts and consistency

# The checks that are meaningful on a repository with no application code yet:
# the two machine-readable contracts, the workflow files themselves, and the
# duplication this repository carries that nothing else would notice.
#
# Every job here answers the pipeline-hardening question — if the thing it checks
# were absent, would it still report success? — by asserting a COUNT, not just an
# exit status.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint api/openapi.yaml
        run: |
          set -euo pipefail
          # Pinned exactly: an unpinned install inside a gating check is an
          # unreviewed dependency deciding whether the gate passes.
          npx --yes @redocly/cli@2.53.3 lint api/openapi.yaml

      - name: Assert the spec actually describes paths
        run: |
          set -euo pipefail
          # A spec that parses but declares nothing lints clean. Count the paths.
          N=$(npx --yes js-yaml@4.1.0 api/openapi.yaml | jq '.paths | length')
          echo "Paths declared: $N"
          if [ "${N:-0}" -lt 1 ]; then
            echo "::error::api/openapi.yaml declares zero paths. A spec with no paths lints clean and asserts nothing."
            exit 1
          fi

  namespace-schema:
    name: Namespace schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile the schema
        run: |
          set -euo pipefail
          npx --yes -p ajv-cli@5.0.0 -p ajv@8.20.0 \
            ajv compile -s schemas/sparc-namespace-props.v1.schema.json --spec=draft2020

      - name: Validate the prop examples from the design docs
        run: |
          set -euo pipefail
          # docs/03-data-model.md documents each prop with an example value. Those
          # examples are the contract as a human reads it; this asserts they agree
          # with the contract as a machine reads it.
          mkdir -p /tmp/props
          cat > /tmp/props/valid.json <<'JSON'
          [
            {"name":"node-type","ns":"https://sparc.risk-sentinel.org/ns","value":"boundary"},
            {"name":"parent-uuid","ns":"https://sparc.risk-sentinel.org/ns","value":"3fa85f64-5717-4562-b3fc-2c963f66afa6"},
            {"name":"next-decision-date","ns":"https://sparc.risk-sentinel.org/ns","value":"2026-10-11"},
            {"name":"fips-199","ns":"https://sparc.risk-sentinel.org/ns","value":"high"},
            {"name":"blocks-ato","ns":"https://sparc.risk-sentinel.org/ns","value":"true"},
            {"name":"evidence-kind","ns":"https://sparc.risk-sentinel.org/ns","value":"manual-attestation"},
            {"name":"signed-by","ns":"https://sparc.risk-sentinel.org/ns","value":"3fa85f64-5717-4562-b3fc-2c963f66afa6"},
            {"name":"condition-expires","ns":"https://sparc.risk-sentinel.org/ns","value":"2026-11-01"},
            {"name":"trigger","ns":"https://sparc.risk-sentinel.org/ns","value":"score<0.85"}
          ]
          JSON
          # Must REJECT these — a schema that accepts everything validates nothing.
          cat > /tmp/props/invalid.json <<'JSON'
          [
            {"name":"node-type","ns":"https://sparc.risk-sentinel.org/ns","value":"agency"},
            {"name":"fips-199","ns":"https://sparc.risk-sentinel.org/ns","value":"critical"},
            {"name":"blocks-ato","ns":"https://sparc.risk-sentinel.org/ns","value":"yes"},
            {"name":"next-decision-date","ns":"https://sparc.risk-sentinel.org/ns","value":"11-10-2026"},
            {"name":"parent-uuid","ns":"https://sparc.risk-sentinel.org/ns","value":"not-a-uuid"},
            {"name":"trigger","ns":"https://sparc.risk-sentinel.org/ns","value":"score is low"},
            {"name":"unknown-prop","ns":"https://sparc.risk-sentinel.org/ns","value":"x"},
            {"name":"node-type","ns":"https://example.com/ns/other","value":"boundary"}
          ]
          JSON

          S=schemas/sparc-namespace-props.v1.schema.json
          PASS=0; FAIL=0
          for i in $(seq 0 8); do
            jq ".[$i]" /tmp/props/valid.json > /tmp/one.json
            if npx --yes -p ajv-cli@5.0.0 -p ajv@8.20.0 ajv validate -s "$S" -d /tmp/one.json --spec=draft2020 >/dev/null 2>&1; then
              PASS=$((PASS+1))
            else
              echo "::error::Documented example $i was REJECTED by the schema: $(cat /tmp/one.json)"
              FAIL=$((FAIL+1))
            fi
          done
          for i in $(seq 0 7); do
            jq ".[$i]" /tmp/props/invalid.json > /tmp/one.json
            if npx --yes -p ajv-cli@5.0.0 -p ajv@8.20.0 ajv validate -s "$S" -d /tmp/one.json --spec=draft2020 >/dev/null 2>&1; then
              echo "::error::Invalid prop $i was ACCEPTED by the schema: $(cat /tmp/one.json)"
              FAIL=$((FAIL+1))
            else
              PASS=$((PASS+1))
            fi
          done
          echo "Schema assertions: $PASS passed, $FAIL failed (expected 17 passed, 0 failed)"
          [ "$PASS" -eq 17 ] && [ "$FAIL" -eq 0 ]

  fixture-props:
    name: Fixture namespace props
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate every SPARC-namespace prop in the fixtures
        run: |
          set -euo pipefail
          # The namespace schema is a SELECTIVE validator: it applies to props
          # whose ns is the SPARC namespace, and to every one of them. Props
          # from other namespaces, and props with no ns at all, are preserved
          # as issued and must not be validated here — applying the schema to
          # them would reject valid OSCAL.
          #
          # This is not `sparc-validate`, which also enforces which props a
          # document must carry. It is the half that can run in this
          # repository, and it is labelled as a proxy rather than as the P0
          # exit criterion being met.
          S=schemas/sparc-namespace-props.v1.schema.json
          NS="https://sparc.risk-sentinel.org/ns"

          jq -s --arg ns "$NS" '[.. | objects | select(has("props")) | .props[] | select(.ns == $ns)]' \
            fixtures/oscal/*.json > /tmp/sparc-props.json

          TOTAL=$(jq 'length' /tmp/sparc-props.json)
          NAMES=$(jq -r '[.[].name] | unique | length' /tmp/sparc-props.json)
          echo "SPARC-namespace props in fixtures/oscal: ${TOTAL}, across ${NAMES} distinct names."

          # A loop over an empty list validates nothing and exits 0.
          if [ "${TOTAL:-0}" -lt 1 ]; then
            echo "::error::No SPARC-namespace props found in the fixtures. Either the fixtures are missing or the filter is wrong; both make this job meaningless."
            exit 1
          fi
          if [ "${NAMES:-0}" -ne 9 ]; then
            echo "::error::Expected all 9 namespace props to be exercised, found ${NAMES}."
            jq -r '[.[].name] | unique | .[]' /tmp/sparc-props.json
            exit 1
          fi

          # One validation over the whole array rather than one call per prop:
          # a wrapper schema whose items $ref the namespace schema by its $id,
          # with the real schema supplied as a reference.
          cat > /tmp/fixture-props.schema.json <<'JSON'
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "$id": "https://sparc.risk-sentinel.org/ns/v1/fixture-props.schema.json",
            "type": "array",
            "items": { "$ref": "https://sparc.risk-sentinel.org/ns/v1/props.schema.json" }
          }
          JSON

          # Installed with --ignore-scripts and called directly, rather than
          # through `npx`. npx resolves and executes a package on demand,
          # running its install lifecycle scripts — arbitrary code from the
          # registry — before the tool does anything. This is the pattern
          # sonarqube-hdf-emit.yml already uses and the one SR-3 in
          # docs/compliance/nist-sp800-53-rev5-mapping.md claims for this
          # repository. The other jobs in this file still use npx; that is
          # pre-existing and tracked on #42, not something this job should
          # quietly inherit.
          npm install --prefix /tmp/ajv --no-fund --no-audit --ignore-scripts \
            ajv-cli@5.0.0 ajv@8.20.0
          /tmp/ajv/node_modules/.bin/ajv validate \
            -s /tmp/fixture-props.schema.json -r "$S" -d /tmp/sparc-props.json --spec=draft2020
          echo "PASS — ${TOTAL} props validated against the namespace schema."

      - name: Canary — the batch validation must still reject a bad prop
        run: |
          set -euo pipefail
          # A wrapper schema that resolved its $ref to nothing would validate
          # an array of anything and report green over 150 unchecked props.
          jq '. + [{"name":"fips-199","ns":"https://sparc.risk-sentinel.org/ns","value":"catastrophic"}]' \
            /tmp/sparc-props.json > /tmp/sparc-props-planted.json

          if /tmp/ajv/node_modules/.bin/ajv validate \
            -s /tmp/fixture-props.schema.json -r schemas/sparc-namespace-props.v1.schema.json \
            -d /tmp/sparc-props-planted.json --spec=draft2020 >/dev/null 2>&1; then
            echo "::error::A prop with fips-199=catastrophic was ACCEPTED. The batch validation is not validating."
            exit 1
          fi
          echo "PASS — the planted prop was rejected."

      - name: Assert the foreign and absent-ns props are still there
        run: |
          set -euo pipefail
          # The fixtures carry a prop from an authority Horizon does not own,
          # CamelCase intact, and a prop with no ns at all. Both exist so the
          # selective-validator rule above is exercised rather than asserted;
          # losing them would make the job above pass while proving less.
          FOREIGN=$(jq -s '[.. | objects | select(has("props")) | .props[] | select(.ns != null and (.ns | startswith("https://sparc.risk-sentinel.org/ns") | not))] | length' fixtures/oscal/*.json)
          ABSENT=$(jq -s '[.. | objects | select(has("props")) | .props[] | select(has("ns") | not)] | length' fixtures/oscal/*.json)
          echo "Foreign-namespace props: ${FOREIGN}; props with no ns: ${ABSENT}."
          if [ "${FOREIGN:-0}" -lt 1 ] || [ "${ABSENT:-0}" -lt 1 ]; then
            echo "::error::The fixtures no longer carry both a foreign-namespace prop and an ns-less prop."
            exit 1
          fi

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          set -euo pipefail
          # Installed via the Go module proxy at a pinned version, so the download
          # is checksum-verified against sum.golang.org rather than trusting a
          # release tarball. A workflow schema error otherwise yields a 0-second
          # run with no jobs and no logs, which is why this is a gate.
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ---- Prove the shellcheck integration is live (#8) --------------------
      # actionlint exits 0 when the shellcheck binary is absent: it SKIPS the
      # integration rather than reporting it. So a runner image that stopped
      # shipping shellcheck would remove a whole class of coverage while this
      # job stayed green. Measured on actionlint v1.7.12:
      #   shellcheck 0.10.0 on PATH -> rc=1 on the canary, reports SC2012
      #   shellcheck absent         -> rc=0 on the canary
      - name: Install shellcheck at the pinned version
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          # Pinned rather than taken from the runner image. An unpinned linter
          # silently changes what the gate measures when the image is bumped,
          # and neither guard below catches it: the presence check passes
          # because some shellcheck is still there, and the canary passes
          # because SC2012 is stable. The lint's meaning would change between
          # two runs of identical code with every signal green.
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          # --proto/--proto-redir pin the scheme on the request AND on any
          # redirect: -L alone will follow a 30x to plain HTTP. The digest below
          # would catch a substituted archive, but not the downgrade itself, and
          # the same flags are already used in sonarqube-hdf-emit.yml.
          curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 \
            -o /tmp/shellcheck.tar.xz "$url"
          # Verified against a recorded digest, not trusted because it came
          # from a release URL over TLS.
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Assert shellcheck is present, and is the version we pinned
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error::shellcheck is not on PATH. actionlint silently skips its shellcheck integration without it, so this job would pass having checked no shell at all. The install step above should have placed it; do not remove this assertion."
            exit 1
          fi
          have="$(shellcheck --version | sed -n 's/^version: //p')"
          want="${SHELLCHECK_VERSION#v}"
          echo "shellcheck ${have} (pinned ${want})"
          if [ "${have}" != "${want}" ]; then
            echo "::error::shellcheck is ${have} but the pin is ${want}. The version on PATH is not the one this job installed — resolve before trusting the lint below."
            exit 1
          fi
          echo "PASS — shellcheck ${have} matches the pin."

      - name: Canary — actionlint must report the planted shell defect
        run: |
          set -euo pipefail
          FIXTURE=tests/actionlint-fixture/shellcheck-canary.yml
          test -f "$FIXTURE" || { echo "::error::Canary fixture $FIXTURE is missing. Without it, a silently-skipped shellcheck integration is undetectable."; exit 1; }
          # Capture rc immediately: a trailing grep would report on grep, not actionlint.
          out=$(actionlint "$FIXTURE" 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::actionlint did NOT flag the planted defect in $FIXTURE. Either shellcheck is no longer wired into actionlint, or the plant was 'fixed'. The workflow lint below cannot be trusted until this is resolved — see tests/actionlint-fixture/README.md and #8."
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'SC2012'; then
            echo "::error::actionlint failed on $FIXTURE but not with SC2012. The canary is meant to pin the shellcheck path specifically; investigate before trusting the lint below."
            exit 1
          fi
          echo "PASS — canary reported SC2012, so actionlint's shellcheck integration is live."

      - name: Lint every workflow
        run: |
          set -euo pipefail
          # find, not ls: shellcheck SC2012, and it is the correct tool here
          # regardless — this count is the assertion that the job linted something.
          N=$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l | tr -d ' ')
          echo "Workflows found: $N"
          if [ "$N" -lt 1 ]; then
            echo "::error::No workflow files found — this job would otherwise pass by linting nothing."
            exit 1
          fi
          # No arguments: actionlint lints .github/workflows/ only, so the canary
          # fixture under tests/ is deliberately out of scope here.
          actionlint -color

  duplication:
    name: Duplicated copies agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docs/hud.html has not come back
        run: |
          set -euo pipefail
          # docs/hud.html was a byte-identical copy of demo/hud.html, removed in #4.
          # This guard replaces the diff that used to keep the two in step: without
          # it nothing stops the copy being re-added, and the copy is only a problem
          # because it is invisible once it exists.
          if [ -e docs/hud.html ]; then
            echo "::error::docs/hud.html is back. It was removed in #4 as a duplicate of demo/hud.html. The demos live in demo/ only; link to ../demo/hud.html from docs rather than copying it."
            exit 1
          fi
          echo "PASS — no duplicate hud.html under docs/."

      - name: full-plan.html carries the demo scripts
        run: |
          set -euo pipefail
          # demo/full-plan.html contains verbatim copies of both demo scripts. A
          # change to either demo that is not mirrored there is silently
          # incomplete, and the file is 66 KB so review will not catch it.
          fail=0
          # Anchor on a handful of distinctive symbols from each source script.
          for sym in "decOf" "simCount" "showCtrl" "renderDrill" "syncControls"; do
            in_src=0
            grep -q "$sym" demo/hud.html && in_src=1
            grep -q "$sym" demo/planner.html && in_src=1
            if [ "$in_src" -eq 1 ] && ! grep -q "$sym" demo/full-plan.html; then
              echo "::error::Symbol '$sym' exists in a demo script but not in demo/full-plan.html — the verbatim copy has drifted (see docs/dev/Developer_Collision_Avoidance_Plan.md 2.1)."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "PASS — full-plan.html carries the demo script symbols."
          exit "$fail"

      - name: Roadmap phase IDs appear in both planners
        run: |
          set -euo pipefail
          fail=0
          for ph in P0 P1 P2 P3 P4 P5 P6 P7 P8; do
            for f in demo/planner.html demo/full-plan.html; do
              grep -q "'${ph}'" "$f" || { echo "::error::Phase ${ph} from docs/roadmap.md is missing from ${f} (three copies of the phase data — see Developer_Collision_Avoidance_Plan.md 2.3)."; fail=1; }
            done
          done
          [ "$fail" -eq 0 ] && echo "PASS — all nine phases present in both planner copies."
          exit "$fail"
